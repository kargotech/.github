name: Claude Code Review (Reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running inside an automated, non-interactive CI pipeline reviewing PR #${{ github.event.pull_request.number || github.event.issue.number }}.

            STRICT CI RULES:
            1. DO NOT ask for human input or clarification under any circumstances.
            2. DO NOT delegate tasks to sub-agents or multi-agent tools. Perform all analysis directly in this session.

            Review Pull Request #${{ github.event.pull_request.number || github.event.issue.number }} and post inline comments for:
            1. Logic errors and edge cases
            2. Security vulnerabilities (SQL injection, XSS, auth bypasses)
            3. Performance issues (N+1 queries, blocking calls, memory leaks)
            4. Missing error handling

            Focus on the changed files in this PR only. Be specific — cite line numbers.

            In case no issues are found, post a pull request comment stating that no issues were found.

          claude_args: '--max-turns 50 --model sonnet --allowedTools "Bash,Edit,Read,Write,Skill,Task,Agent"'
          show_full_output: true
